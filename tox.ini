[tox]
envlist = py310, py311, py312, py313, docs, lint, ty
skip_missing_interpreters = True

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
# tox installs the package itself (plus the extras below), so its
# [project.dependencies] are the single source of truth for runtime deps.
extras =
    QRCode
    Talkback
deps =
    -r{toxinidir}/requirements_test.txt
commands =
    pytest --timeout=2 --cov --cov-report= {posargs}

[testenv:codecov]
extras =
    QRCode
    Talkback
deps =
    -r{toxinidir}/requirements_test.txt
commands =
    pytest --timeout=2 --cov --cov-report=xml {posargs}

[testenv:temperature]
basepython = python3.12
extras =
    QRCode
commands =
    python main.py

[testenv:docs]
changedir = docs
deps =
    -r{toxinidir}/requirements_docs.txt
commands =
    make clean
    sphinx-build -W -b html source {envtmpdir}/html
allowlist_externals=
    /usr/bin/make
    make

[testenv:lint]
# Ruff does not import the package, so the env does not need it installed.
package = skip
deps =
    ruff
commands =
    ruff check pyhap tests benchmarks
    ruff format --check pyhap tests benchmarks

[testenv:ty]
extras =
    QRCode
    Talkback
    # benchmarks/ is in [tool.ty.src], so the type checker needs its deps too.
    bench
deps =
    -r{toxinidir}/requirements_test.txt
    # ty type checks against python-version 3.10, where hap_handler
    # imports async_timeout instead of asyncio.timeout.
    async_timeout
commands =
    ty check
