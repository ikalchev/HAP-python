# Read the Docs build configuration, see:
# https://docs.readthedocs.io/en/stable/build-customization.html
#
# The HAP-python docs live in docs/ (Sphinx, source in docs/source).
# "latest" builds the dev branch, tags build the "stable" versions.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: requirements_docs.txt
    - method: pip
      path: .